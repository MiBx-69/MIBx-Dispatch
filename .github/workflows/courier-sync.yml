name: Courier Sync Cron

on:
  schedule:
    # Runs every 2 hours (0:00, 2:00, 4:00, etc. UTC)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  sync-courier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Courier Sync Endpoint
        run: |
          echo "Triggering courier sync on orders.universesraw.com..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://orders.universesraw.com/api/cron/courier-sync" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          
          echo "Response:"
          echo "$RESPONSE"
          
          STATUS=$(echo "$RESPONSE" | tr -d '\r' | grep "HTTP_STATUS:" | cut -d':' -f2)
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "Courier sync executed successfully with HTTP $STATUS"
          else
            echo "Failed with HTTP $STATUS"
            exit 1
          fi
